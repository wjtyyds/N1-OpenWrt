name: Build N1 Firmware
run-name: "📦 ${{ inputs.firmware_type }}-${{ inputs.source_branch }} ${{ inputs.firmware_type != 'Lede-Native' && inputs.firmware_type != 'iStoreOS' && format('| Kernel {0}-{1} ', inputs.kernel_version, inputs.kernel_builder == 'kernel_stable' && 'stable' || 'flippy') || '' }}| ${{ inputs.build_type }}"
on:
  workflow_dispatch:
    inputs:
      firmware_type:
        description: '选择固件源码'
        required: true
        default: 'OpenWrt'
        type: choice
        options:
          - OpenWrt
          - ImmortalWrt
          - Lede
          - Lede-Native
          - iStoreOS
      build_type:
        description: '编译目标'
        required: true
        default: 'Public'
        type: choice
        options:
          - Public
          - Personal
      source_branch:
        description: '填写源码分支或 Tag (若是 lede，可直接填写 Rxx.xx.xx 当作标题)'
        required: true
        default: 'v25.12.5'
      kernel_version:
        description: '打包内核版本 (注：若是原生编译则无需理会此项)'
        required: true
        default: '6.18.56'
      kernel_builder:
        description: '选择内核分支 (注：若是原生编译则无需理会此项)'
        required: true
        default: 'kernel_flippy'
        type: choice
        options:
          - kernel_flippy
          - kernel_stable
      export_config:
        description: '是否在 Release 中附带 .config 配置文件'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Convert inputs to lowercase for scripts
        run: |
          echo "FIRMWARE_LOWER=$(echo '${{ inputs.firmware_type }}' | tr 'A-Z' 'a-z')" >> $GITHUB_ENV
          echo "BUILD_LOWER=$(echo '${{ inputs.build_type }}' | tr 'A-Z' 'a-z')" >> $GITHUB_ENV

      - name: Initialize the build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo "开始物理清理，腾出空间..."
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          
          echo "更新软件源并清理大型无用包..."
          sudo apt-get -y update
          sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          
          echo "安装核心依赖..."
          sudo apt-get -y install clang llvm jq dwarves libelf-dev $(curl -fsSL https://ophub.org/ubuntu2204-make-openwrt-depends)
          
          echo "重载系统守护进程..."
          sudo systemctl daemon-reload
          
          echo "清理缓存..."
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          
          sudo timedatectl set-timezone "Asia/Shanghai"
          
          echo "START_DATE=$(date +'%Y.%m.%d')" >> $GITHUB_ENV
          echo "✅ 环境安装完毕！"

      - name: Clone Source Code
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_TOKEN }}
        run: |
          if [ "${{ env.FIRMWARE_LOWER }}" == "openwrt" ]; then
            REPO_URL="https://github.com/openwrt/openwrt"
            TARGET_BRANCH="${{ inputs.source_branch }}"
          elif [ "${{ env.FIRMWARE_LOWER }}" == "immortalwrt" ]; then
            REPO_URL="https://github.com/immortalwrt/immortalwrt"
            TARGET_BRANCH="${{ inputs.source_branch }}"
          elif [ "${{ env.FIRMWARE_LOWER }}" == "istoreos" ]; then
            REPO_URL="https://github.com/istoreos/istoreos.git"
            # 智能补全：如果用户只填了版本号，底层自动加上 istoreos- 前缀
            if [[ "${{ inputs.source_branch }}" != istoreos-* ]]; then
              TARGET_FEEDS="configs/feeds_istoreos-${{ inputs.source_branch }}.conf"
            else
              TARGET_FEEDS="configs/feeds_${{ inputs.source_branch }}.conf"
            fi
          elif [[ "${{ env.FIRMWARE_LOWER }}" == lede* ]]; then
            REPO_URL="https://github.com/coolsnowwolf/lede"
            if [[ "${{ inputs.source_branch }}" =~ ^R([0-9]{2})\.([0-9]{2})\.([0-9]{2})$ ]]; then
              YEAR="20${BASH_REMATCH[1]}"
              MONTH="${BASH_REMATCH[2]}"
              DAY="${BASH_REMATCH[3]}"
              TARGET_DATE="${YEAR}-${MONTH}-${DAY}T23:59:59Z"
              API_URL="https://api.github.com/repos/coolsnowwolf/lede/commits?until=$TARGET_DATE&per_page=1"
              API_RESP=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "$API_URL")
              TARGET_BRANCH=$(echo "$API_RESP" | jq -r '.[0].sha' 2>/dev/null)
              if [ "$TARGET_BRANCH" == "null" ] || [ -z "$TARGET_BRANCH" ]; then
                TARGET_BRANCH="master"
              fi
            else
              TARGET_BRANCH="${{ inputs.source_branch }}"
            fi
          fi
          
          echo "开始精准锁定指定的 Tag/Branch/Hash: $TARGET_BRANCH"
          mkdir openwrt && cd openwrt
          git init
          git remote add origin $REPO_URL
          git fetch --depth 1 origin "$TARGET_BRANCH"
          git checkout FETCH_HEAD
          
          CURRENT_HASH=$(git log -1 --format="%h")
          echo "✅ 源码已成功锁定至最新提交哈希: $CURRENT_HASH"

      - name: Update & Install Feeds
        run: |
          if [ "${{ env.FIRMWARE_LOWER }}" == "istoreos" ]; then
            # 优先寻找匹配当前分支名的 feeds 配置文件
            TARGET_FEEDS="configs/feeds_${{ inputs.source_branch }}.conf"
            # 兜底的通用 feeds 配置文件
            DEFAULT_FEEDS="configs/feeds_istoreos.conf"
          
            if [ -f "$TARGET_FEEDS" ]; then
              echo "====== 匹配到分支专属 feeds 配置，开始注入: $TARGET_FEEDS ======"
              cp "$TARGET_FEEDS" openwrt/feeds.conf
            elif [ -f "$DEFAULT_FEEDS" ]; then
              echo "====== 未匹配到专属文件，使用兜底 feeds 配置: $DEFAULT_FEEDS ======"
              cp "$DEFAULT_FEEDS" openwrt/feeds.conf
            else
              echo "====== 未找到任何自定义 feeds 配置，保持源码默认状态 ======"
            fi
          fi
          
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a -f < /dev/null

      - name: Load Custom Plugins & Uninstall Conflicts
        env:
          FIRMWARE_TYPE: ${{ env.FIRMWARE_LOWER }}
          BUILD_TYPE: ${{ env.BUILD_LOWER }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          PPPOE_USER: ${{ secrets.PPPOE_USER }}
          PPPOE_PASS: ${{ secrets.PPPOE_PASS }}
          GH_TOKEN: ${{ secrets.PRIVATE_TOKEN }}
        run: |
          cd openwrt
          chmod +x $GITHUB_WORKSPACE/scripts/diy-part2.sh
          $GITHUB_WORKSPACE/scripts/diy-part2.sh

      - name: Load Configuration
        run: |
          CONF_NAME="${{ env.FIRMWARE_LOWER }}"
          if [ "$CONF_NAME" == "lede-native" ]; then CONF_NAME="lede-native"; fi
          cp configs/${CONF_NAME}.config openwrt/.config
          
          sed -i 's/CONFIG_KERNEL_DEBUG_INFO=y/# CONFIG_KERNEL_DEBUG_INFO is not set/g' openwrt/.config
          sed -i 's/CONFIG_KERNEL_DEBUG_KERNEL=y/# CONFIG_KERNEL_DEBUG_KERNEL is not set/g' openwrt/.config
          sed -i 's/CONFIG_GDB=y/# CONFIG_GDB is not set/g' openwrt/.config
          
          sed -i 's/CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client=y/# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client is not set/g' openwrt/.config
          sed -i 's/CONFIG_PACKAGE_shadowsocks-rust-sslocal=y/# CONFIG_PACKAGE_shadowsocks-rust-sslocal is not set/g' openwrt/.config
          
          if [ "${{ env.FIRMWARE_LOWER }}" == "lede-native" ]; then
            echo "====== 开始向 Lede-Native 白纸注入选定插件 ======"
            echo "CONFIG_PACKAGE_luci-app-diskman=y" >> openwrt/.config
            echo "CONFIG_PACKAGE_luci-app-diskman_INCLUDE_lsblk=y" >> openwrt/.config
            echo "CONFIG_PACKAGE_luci-app-oui=y" >> openwrt/.config
            echo "CONFIG_PACKAGE_luci-app-package-manager=y" >> openwrt/.config
            echo "CONFIG_PACKAGE_luci-theme-aurora=y" >> openwrt/.config
            echo "CONFIG_PACKAGE_luci-app-aurora-config=y" >> openwrt/.config
            echo "CONFIG_PACKAGE_luci-app-adguardhome=y" >> openwrt/.config
            echo "CONFIG_PACKAGE_luci-app-lucky=y" >> openwrt/.config
            echo "CONFIG_PACKAGE_luci-app-openclash=y" >> openwrt/.config
            echo "CONFIG_PACKAGE_luci-app-oaf=y" >> openwrt/.config

            if [ "${{ env.BUILD_LOWER }}" == "public" ]; then
              echo "CONFIG_PACKAGE_luci-app-dockerman=y" >> openwrt/.config
              echo "CONFIG_PACKAGE_luci-app-daede=y" >> openwrt/.config
              echo "CONFIG_PACKAGE_dae=y" >> openwrt/.config
              echo "CONFIG_PACKAGE_luci-app-passwall=y" >> openwrt/.config
              echo "CONFIG_PACKAGE_luci-app-passwall_Iptables_Transparent_Proxy=y" >> openwrt/.config
              echo "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Geoview=y" >> openwrt/.config
              echo "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Haproxy=y" >> openwrt/.config
              echo "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Hysteria=y" >> openwrt/.config
              echo "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client=y" >> openwrt/.config
              echo "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Client=y" >> openwrt/.config
              echo "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=y" >> openwrt/.config
              echo "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Geodata=y" >> openwrt/.config
              echo "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Plugin=y" >> openwrt/.config
              echo "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y" >> openwrt/.config
              echo "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray_Plugin=y" >> openwrt/.config
            fi
          fi

          if [ "${{ env.BUILD_LOWER }}" == "personal" ]; then
            echo "====== 开始注入 Personal 版本专属强效断根指令 ======"
            sed -i 's/CONFIG_PACKAGE_luci-app-dockerman=y/# CONFIG_PACKAGE_luci-app-dockerman is not set/g' openwrt/.config
            sed -i 's/CONFIG_PACKAGE_luci-lib-docker=y/# CONFIG_PACKAGE_luci-lib-docker is not set/g' openwrt/.config
            sed -i 's/CONFIG_PACKAGE_docker=y/# CONFIG_PACKAGE_docker is not set/g' openwrt/.config
            sed -i 's/CONFIG_PACKAGE_docker-compose=y/# CONFIG_PACKAGE_docker-compose is not set/g' openwrt/.config
            sed -i 's/CONFIG_PACKAGE_dockerd=y/# CONFIG_PACKAGE_dockerd is not set/g' openwrt/.config
            sed -i 's/CONFIG_PACKAGE_containerd=y/# CONFIG_PACKAGE_containerd is not set/g' openwrt/.config
            sed -i 's/CONFIG_PACKAGE_runc=y/# CONFIG_PACKAGE_runc is not set/g' openwrt/.config
            sed -i 's/CONFIG_DOCKER_NET_MACVLAN=y/# CONFIG_DOCKER_NET_MACVLAN is not set/g' openwrt/.config
            sed -i 's/CONFIG_DOCKER_STO_EXT4=y/# CONFIG_DOCKER_STO_EXT4 is not set/g' openwrt/.config
          
            sed -i 's/CONFIG_PACKAGE_luci-app-passwall=y/# CONFIG_PACKAGE_luci-app-passwall is not set/g' openwrt/.config
            sed -i '/CONFIG_PACKAGE_luci-app-passwall_/d' openwrt/.config
            sed -i 's/CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y/# CONFIG_PACKAGE_luci-i18n-passwall-zh-cn is not set/g' openwrt/.config
            sed -i 's/CONFIG_PACKAGE_luci-app-ssr-plus=y/# CONFIG_PACKAGE_luci-app-ssr-plus is not set/g' openwrt/.config
            sed -i '/CONFIG_PACKAGE_luci-app-ssr-plus_/d' openwrt/.config
            sed -i 's/CONFIG_PACKAGE_xray-core=y/# CONFIG_PACKAGE_xray-core is not set/g' openwrt/.config
            sed -i 's/CONFIG_PACKAGE_sing-box=y/# CONFIG_PACKAGE_sing-box is not set/g' openwrt/.config
            sed -i 's/CONFIG_PACKAGE_shadowsocksr-libev-ssr-local=y/# CONFIG_PACKAGE_shadowsocksr-libev-ssr-local is not set/g' openwrt/.config
            sed -i 's/CONFIG_PACKAGE_shadowsocksr-libev-ssr-redir=y/# CONFIG_PACKAGE_shadowsocksr-libev-ssr-redir is not set/g' openwrt/.config
            sed -i 's/CONFIG_PACKAGE_v2ray-plugin=y/# CONFIG_PACKAGE_v2ray-plugin is not set/g' openwrt/.config
            sed -i 's/CONFIG_PACKAGE_v2ray-geoip=y/# CONFIG_PACKAGE_v2ray-geoip is not set/g' openwrt/.config
            sed -i 's/CONFIG_PACKAGE_v2ray-geosite=y/# CONFIG_PACKAGE_v2ray-geosite is not set/g' openwrt/.config
            sed -i 's/CONFIG_PACKAGE_shadowsocks-rust=y/# CONFIG_PACKAGE_shadowsocks-rust is not set/g' openwrt/.config
            sed -i 's/CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Server=y/# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Server is not set/g' openwrt/.config
            sed -i 's/CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client=y/# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client is not set/g' openwrt/.config
            sed -i 's/CONFIG_PACKAGE_shadowsocks-rust-sslocal=y/# CONFIG_PACKAGE_shadowsocks-rust-sslocal is not set/g' openwrt/.config
          
            sed -i 's/CONFIG_PACKAGE_haproxy=y/# CONFIG_PACKAGE_haproxy is not set/g' openwrt/.config
            sed -i 's/CONFIG_PACKAGE_chinadns-ng=y/# CONFIG_PACKAGE_chinadns-ng is not set/g' openwrt/.config
            sed -i 's/CONFIG_PACKAGE_dns2socks=y/# CONFIG_PACKAGE_dns2socks is not set/g' openwrt/.config
            sed -i 's/CONFIG_PACKAGE_ipt2socks=y/# CONFIG_PACKAGE_ipt2socks is not set/g' openwrt/.config
            sed -i 's/CONFIG_PACKAGE_microsocks=y/# CONFIG_PACKAGE_microsocks is not set/g' openwrt/.config
            sed -i 's/CONFIG_PACKAGE_tcping=y/# CONFIG_PACKAGE_tcping is not set/g' openwrt/.config
            sed -i 's/CONFIG_PACKAGE_geoview=y/# CONFIG_PACKAGE_geoview is not set/g' openwrt/.config
            sed -i 's/CONFIG_PACKAGE_simple-obfs-client=y/# CONFIG_PACKAGE_simple-obfs-client is not set/g' openwrt/.config
          fi
          
          if [ "${{ env.BUILD_LOWER }}" == "public" ] && [ "${{ env.FIRMWARE_LOWER }}" != "lede-native" ]; then
            echo "CONFIG_PACKAGE_luci-app-daede=y" >> openwrt/.config
            echo "CONFIG_PACKAGE_dae=y" >> openwrt/.config
          fi
          
          echo "CONFIG_DEVEL=y" >> openwrt/.config
          echo "CONFIG_BPF_TOOLCHAIN_HOST=y" >> openwrt/.config
          
          if [ "${{ env.FIRMWARE_LOWER }}" == "lede-native" ]; then
            echo "====== 修正 Amlogic 分区锁，并强迫生成指定格式镜像 ======"
            if [ -f openwrt/target/linux/amlogic/image/Makefile ]; then
              sed -i 's/256/1024/g' openwrt/target/linux/amlogic/image/Makefile
              sed -i 's/ROOTFS_PARTSIZE:=.*/ROOTFS_PARTSIZE:=1024/g' openwrt/target/linux/amlogic/image/Makefile
            fi
          
            sed -i 's/# CONFIG_TARGET_ROOTFS_EXT4FS is not set/CONFIG_TARGET_ROOTFS_EXT4FS=y/g' openwrt/.config
            grep -q "CONFIG_TARGET_ROOTFS_EXT4FS=y" openwrt/.config || echo "CONFIG_TARGET_ROOTFS_EXT4FS=y" >> openwrt/.config
            grep -q "CONFIG_TARGET_IMAGES_GZIP=y" openwrt/.config || echo "CONFIG_TARGET_IMAGES_GZIP=y" >> openwrt/.config
          
            sed -i 's/CONFIG_TARGET_ROOTFS_SQUASHFS=y/# CONFIG_TARGET_ROOTFS_SQUASHFS is not set/g' openwrt/.config
          
            sed -i 's/CONFIG_TARGET_ROOTFS_PARTSIZE=.*/CONFIG_TARGET_ROOTFS_PARTSIZE=1024/g' openwrt/.config
            grep -q "CONFIG_TARGET_ROOTFS_PARTSIZE=" openwrt/.config || echo "CONFIG_TARGET_ROOTFS_PARTSIZE=1024" >> openwrt/.config
          fi
          
          if [ "${{ env.FIRMWARE_LOWER }}" == "istoreos" ]; then
            echo "====== 开始向 iStoreOS 写入定制插件配置 ======"
          
            # 基础定制应用
            echo "CONFIG_PACKAGE_luci-app-adguardhome=y" >> openwrt/.config
            echo "CONFIG_PACKAGE_luci-app-lucky=y" >> openwrt/.config
            echo "CONFIG_PACKAGE_luci-app-oaf=y" >> openwrt/.config
            echo "CONFIG_PACKAGE_luci-app-openclash=y" >> openwrt/.config

            if [ "${{ env.BUILD_LOWER }}" == "public" ]; then
              # Public 专属科学与面板
              echo "CONFIG_PACKAGE_luci-app-daede=y" >> openwrt/.config
              echo "CONFIG_PACKAGE_dae=y" >> openwrt/.config
          
              # Passwall 及其底层组件精确勾选
              echo "CONFIG_PACKAGE_luci-app-passwall=y" >> openwrt/.config
              echo "CONFIG_PACKAGE_luci-app-passwall_Iptables_Transparent_Proxy=y" >> openwrt/.config
              echo "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Geoview=y" >> openwrt/.config
              echo "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Haproxy=y" >> openwrt/.config
              echo "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Hysteria=y" >> openwrt/.config
              echo "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client=y" >> openwrt/.config
              echo "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Client=y" >> openwrt/.config
              echo "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=y" >> openwrt/.config
              echo "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Geodata=y" >> openwrt/.config
              echo "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Plugin=y" >> openwrt/.config
              echo "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y" >> openwrt/.config
              echo "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray_Plugin=y" >> openwrt/.config
            fi
          fi
          
          cd openwrt
          make defconfig
          
          if [ "${{ env.FIRMWARE_LOWER }}" == "lede-native" ]; then
            echo "====== 锁定 EXT4 配置 ======"
            sed -i 's/# CONFIG_TARGET_ROOTFS_EXT4FS is not set/CONFIG_TARGET_ROOTFS_EXT4FS=y/g' .config
            grep -q "CONFIG_TARGET_ROOTFS_EXT4FS=y" .config || echo "CONFIG_TARGET_ROOTFS_EXT4FS=y" >> .config
            sed -i 's/CONFIG_TARGET_ROOTFS_PARTSIZE=.*/CONFIG_TARGET_ROOTFS_PARTSIZE=1024/g' .config
            grep -q "CONFIG_TARGET_ROOTFS_PARTSIZE=" .config || echo "CONFIG_TARGET_ROOTFS_PARTSIZE=1024" >> .config
          fi

      - name: Inject Binaries & Configs (原生编译前置注入)
        if: env.FIRMWARE_LOWER == 'lede-native' || env.FIRMWARE_LOWER == 'istoreos'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_TOKEN }}
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
          BUILD_LOWER: ${{ env.BUILD_LOWER }}
        run: |
          echo "====== 原生编译：前置注入最新内核与私密配置 ======"
          BASE_FILES="openwrt/package/base-files/files"
          mkdir -p $BASE_FILES/usr/lib/adg_core
          mkdir -p $BASE_FILES/usr/bin
          mkdir -p $BASE_FILES/etc/openclash/core
          mkdir -p $BASE_FILES/etc/init.d
          mkdir -p $BASE_FILES/etc/rc.d
          
          echo "提取官方最新 AdGuardHome..."
          AGH_API="https://api.github.com/repos/AdguardTeam/AdGuardHome/releases/latest"
          AGH_URL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "$AGH_API" | grep "browser_download_url" | grep "linux_arm64.tar.gz" | head -n 1 | cut -d '"' -f 4)
          if [ -n "$AGH_URL" ]; then
              wget -qO /tmp/agh.tar.gz "$AGH_URL"
              tar -xzf /tmp/agh.tar.gz -C /tmp/
              mv /tmp/AdGuardHome/AdGuardHome $BASE_FILES/usr/lib/adg_core/
              chmod 755 $BASE_FILES/usr/lib/adg_core/AdGuardHome
          fi
          
          echo "提取 Lucky 并进行源码级劫持..."
          mkdir -p openwrt/custom_bins
          if [ "$BUILD_LOWER" == "public" ]; then
            LUCKY_FILE="lucky_2.27.2_Linux_arm64_wanji_docker.tar.gz"
          else
            LUCKY_FILE="lucky_2.27.2_Linux_arm64_wanji.tar.gz"
          fi
          
          if [ -n "$PRIVATE_REPO" ]; then
            gh release download "Private-Configs" -R "$PRIVATE_REPO" -p "$LUCKY_FILE" --clobber >/dev/null 2>&1 || true
          fi
          
          if [ -f "$LUCKY_FILE" ]; then
            tar -xzf "$LUCKY_FILE" -C /tmp/
            mv $(find /tmp/ -type f -name "lucky" | head -n 1) openwrt/custom_bins/lucky
            chmod 755 openwrt/custom_bins/lucky
            sed -i 's|$(PKG_BUILD_DIR)[^ ]*lucky|$(TOPDIR)/custom_bins/lucky|g' openwrt/package/custom/lucky/lucky/Makefile
          fi
          
          echo "提取 OpenClash Meta..."
          wget -qO /tmp/clash_meta.tar.gz "https://raw.githubusercontent.com/vernesong/OpenClash/core/master/meta/clash-linux-arm64.tar.gz" || true
          if [ -f /tmp/clash_meta.tar.gz ]; then
              tar -xzf /tmp/clash_meta.tar.gz -C /tmp/ || true
              mv /tmp/clash $BASE_FILES/etc/openclash/core/clash_meta || true
              chmod 755 $BASE_FILES/etc/openclash/core/clash_meta || true
          fi
          
          if [ "$BUILD_LOWER" == "personal" ]; then
              echo "解压私有配置..."
              if [ -n "$PRIVATE_REPO" ]; then
                  gh release download "Private-Configs" -R "$PRIVATE_REPO" -p "private_config.zip" --clobber >/dev/null 2>&1 || true
                  if [ -f "private_config.zip" ]; then
                      unzip -q "private_config.zip" -d /tmp/private_conf/ || true
                      [ -f "/tmp/private_conf/AdGuardHome.yaml" ] && mv /tmp/private_conf/AdGuardHome.yaml $BASE_FILES/etc/
                      LUCKY_ZIP=$(ls /tmp/private_conf/lucky_*.zip 2>/dev/null | head -n 1)
                      if [ -n "$LUCKY_ZIP" ]; then
                          mkdir -p $BASE_FILES/etc/config/lucky.daji
                          unzip -q -o "$LUCKY_ZIP" -d $BASE_FILES/etc/config/lucky.daji/
                      fi
                  fi
              fi
          fi
          
          echo "注入 AdGuardHome 引导脚本..."
          cat << 'EOF' > $BASE_FILES/etc/init.d/n1_boot_check
          #!/bin/sh /etc/rc.common
          START=99
          start() {
              (
                  sleep 5
                  ROOT_DEV=$(df -h / | tail -n1 | awk '{print $1}')
                  IS_EMMC=0
                  if echo "$ROOT_DEV" | grep -q "mmcblk"; then IS_EMMC=1; fi
          
                  if [ -f /usr/lib/adg_core/AdGuardHome ]; then
                      if [ "$IS_EMMC" = "1" ] && [ -d /mnt/mmcblk2p4 ]; then
                          DATA_DIR="/mnt/mmcblk2p4/AdGuardHome"
                          mkdir -p "$DATA_DIR"
                          cp -n /usr/lib/adg_core/AdGuardHome "$DATA_DIR/AdGuardHome"
                          chmod 755 "$DATA_DIR/AdGuardHome"
                          rm -rf /usr/bin/AdGuardHome
                          ln -sf "$DATA_DIR" /usr/bin/AdGuardHome
                          rm -rf /usr/lib/adg_core
                          rm -rf /usr/bin/AdGuardHome_data
                      else
                          DATA_DIR="/usr/bin/AdGuardHome_data"
                          mkdir -p "$DATA_DIR"
                          cp -n /usr/lib/adg_core/AdGuardHome "$DATA_DIR/AdGuardHome"
                          chmod 755 "$DATA_DIR/AdGuardHome"
                          rm -rf /usr/bin/AdGuardHome
                          ln -sf "$DATA_DIR" /usr/bin/AdGuardHome
                      fi
                      /etc/init.d/AdGuardHome restart 2>/dev/null
                  fi
                  if [ "$IS_EMMC" = "1" ]; then
                      rm -f /etc/rc.d/S99n1_boot_check
                      rm -f /etc/init.d/n1_boot_check
                  fi
              ) &
          }
          EOF
          chmod +x $BASE_FILES/etc/init.d/n1_boot_check
          ln -sf ../init.d/n1_boot_check $BASE_FILES/etc/rc.d/S99n1_boot_check
          
          cat << 'EOF' > $BASE_FILES/etc/rc.local
          # Put your custom commands here that should be executed once
          # the system init finished. By default this file does nothing.
          exit 0
          EOF
          chmod +x $BASE_FILES/etc/rc.local

      - name: Download Package & Compile
        run: |
          cd openwrt
          make download -j8
          make -j$(nproc) || make -j1 || make -j1 V=s

      - name: Package Firmware & Inject Private Mods
        if: env.FIRMWARE_LOWER != 'lede-native' && env.FIRMWARE_LOWER != 'istoreos'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_TOKEN }}
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
        run: |
          git clone https://github.com/unifreq/openwrt_packit packit
          cd packit
          sudo mkdir -p /opt/kernel
          sudo chown -R $USER:$GROUPS /opt/kernel
          
          if [ "${{ inputs.kernel_builder }}" == "kernel_stable" ]; then
            KERNEL_EXT=".tar.gz"; TAR_CMD="tar -xzf"
          else
            KERNEL_EXT=".tar"; TAR_CMD="tar -xf"
          fi
          wget "https://github.com/wjtyyds/amlogic-s9xxx-armbian/releases/download/${{ inputs.kernel_builder }}/${{ inputs.kernel_version }}${KERNEL_EXT}"
          $TAR_CMD ${{ inputs.kernel_version }}${KERNEL_EXT} -C /opt/kernel/
          if [ "${{ inputs.kernel_builder }}" == "kernel_stable" ]; then
            sudo mv /opt/kernel/${{ inputs.kernel_version }}/* /opt/kernel/
          fi
          REAL_KERNEL_VER=$(ls /opt/kernel/boot-* | head -n 1 | sed -e 's|.*/boot-||' -e 's/\.tar\.gz//' -e 's/\.tar//')
          
          if [[ "${{ env.FIRMWARE_LOWER }}" == lede* ]]; then
            if [ "${{ inputs.source_branch }}" != "master" ]; then
              OPENWRT_VER="${{ inputs.source_branch }}"
            else
              OPENWRT_VER="R$(date +%y.%m.%d)"
            fi
          else
            OPENWRT_VER="${{ inputs.source_branch }}"
          fi
          
          echo "KERNEL_VERSION=$REAL_KERNEL_VER" >> make.env
          echo "OPENWRT_VER=$OPENWRT_VER" >> make.env
          echo "WHOAMI=粉墨悲欢@恩山" >> make.env
          
          ROOTFS_FILE=$(find ../openwrt/bin/targets/ -type f -name "*-rootfs.tar.gz" | head -n 1)
          sudo mv "$ROOTFS_FILE" ./openwrt-armvirt-64-default-rootfs.tar.gz
          
          mkdir -p inject_tmp/root inject_tmp/etc inject_tmp/usr/lib/adg_core inject_tmp/etc/init.d inject_tmp/etc/rc.d
          
          echo "获取 AdGuardHome 最新稳定版..."
          AGH_API="https://api.github.com/repos/AdguardTeam/AdGuardHome/releases/latest"
          AGH_RESP=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "$AGH_API")
          AGH_URL=$(echo "$AGH_RESP" | grep "browser_download_url" | grep "linux_arm64.tar.gz" | head -n 1 | cut -d '"' -f 4)
          if [ -n "$AGH_URL" ]; then
              wget -qO /tmp/agh.tar.gz "$AGH_URL"
              mkdir -p /tmp/agh_extract
              tar -xzf /tmp/agh.tar.gz -C /tmp/agh_extract
              AGH_BIN=$(find /tmp/agh_extract -type f -name "AdGuardHome" | head -n 1)
              if [ -n "$AGH_BIN" ]; then
                  mv "$AGH_BIN" inject_tmp/usr/lib/adg_core/AdGuardHome
                  chmod 755 inject_tmp/usr/lib/adg_core/AdGuardHome
              fi
          fi
          
          echo "从私有库获取 Lucky 核心..."
          if [ "${{ env.BUILD_LOWER }}" == "public" ]; then
              LUCKY_FILE="lucky_2.27.2_Linux_arm64_wanji_docker.tar.gz"
          else
              LUCKY_FILE="lucky_2.27.2_Linux_arm64_wanji.tar.gz"
          fi
          
          if [ -n "$PRIVATE_REPO" ]; then
              gh release download "Private-Configs" -R "$PRIVATE_REPO" -p "$LUCKY_FILE" --clobber > /dev/null 2>&1 || true
          fi
          
          if [ -f "$LUCKY_FILE" ]; then
              mkdir -p /tmp/lucky_extract
              tar -xzf "$LUCKY_FILE" -C /tmp/lucky_extract
              LUCKY_BIN=$(find /tmp/lucky_extract -type f -name "lucky" | head -n 1)
              if [ -n "$LUCKY_BIN" ]; then
                  sudo tar --delete -f ./openwrt-armvirt-64-default-rootfs.tar usr/bin/lucky ./usr/bin/lucky 2>/dev/null || true
                  mkdir -p inject_tmp/usr/bin
                  mv "$LUCKY_BIN" inject_tmp/usr/bin/lucky
                  chmod 755 inject_tmp/usr/bin/lucky
              fi
          fi
          
          echo "获取 OpenClash Meta 内核..."
          mkdir -p inject_tmp/etc/openclash/core
          wget -qO /tmp/clash_meta.tar.gz "https://raw.githubusercontent.com/vernesong/OpenClash/core/master/meta/clash-linux-arm64.tar.gz" || true
          if [ -f /tmp/clash_meta.tar.gz ]; then
              mkdir -p /tmp/clash_meta_tmp
              tar -xzf /tmp/clash_meta.tar.gz -C /tmp/clash_meta_tmp/ || true
              if [ -f /tmp/clash_meta_tmp/clash ]; then
                  mv /tmp/clash_meta_tmp/clash inject_tmp/etc/openclash/core/clash_meta
                  chmod 755 inject_tmp/etc/openclash/core/clash_meta
              fi
          fi
          
          OAF_RESP=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/destan19/OpenAppFilter/releases/latest")
          OAF_UI_VER=$(echo "$OAF_RESP" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          if [[ "$OAF_UI_VER" == v7* ]]; then
              OAF_KMOD_TAG="OAF_Kmods_v7.0.1"
          else
              OAF_KMOD_TAG="OAF_Kmods_v6.1.8"
          fi
          if [ -n "$PRIVATE_REPO" ]; then
              gh release download "$OAF_KMOD_TAG" -R "$PRIVATE_REPO" -p "oaf-${REAL_KERNEL_VER}.tar.gz" --clobber > /dev/null 2>&1 || true
          fi
          if [ ! -f "oaf-${REAL_KERNEL_VER}.tar.gz" ] && [ -f "../auto_import/oaf-${REAL_KERNEL_VER}.tar.gz" ]; then
              cp "../auto_import/oaf-${REAL_KERNEL_VER}.tar.gz" ./ || true
          fi
          if [ -f "oaf-${REAL_KERNEL_VER}.tar.gz" ]; then
              tar -xzf "oaf-${REAL_KERNEL_VER}.tar.gz" -C inject_tmp/root/ 2>/dev/null || true
              find inject_tmp/root/ -type f -name "oaf.ko" -exec mv {} inject_tmp/root/oaf.ko \; 2>/dev/null || true
              find inject_tmp/root/ -type d -empty -delete 2>/dev/null || true
          fi
          
          if [ "${{ env.BUILD_LOWER }}" == "personal" ]; then
              if [ -n "$PRIVATE_REPO" ]; then
                  gh release download "Private-Configs" -R "$PRIVATE_REPO" -p "private_config.zip" --clobber > /dev/null 2>&1 || true
                  if [ -f "private_config.zip" ]; then
                      mkdir -p private_conf_tmp
                      unzip -q "private_config.zip" -d private_conf_tmp/ || true
          
                      if [ -f "private_conf_tmp/AdGuardHome.yaml" ]; then
                          mkdir -p inject_tmp/etc
                          mv private_conf_tmp/AdGuardHome.yaml inject_tmp/etc/AdGuardHome.yaml || true
                      fi
                      LUCKY_ZIP=$(ls private_conf_tmp/lucky_*.zip 2>/dev/null | head -n 1)
                      if [ -n "$LUCKY_ZIP" ]; then
                          mkdir -p inject_tmp/etc/config/lucky.daji
                          unzip -q -o "$LUCKY_ZIP" -d inject_tmp/etc/config/lucky.daji/ || true
                      fi
                      rm -rf private_conf_tmp private_config.zip
                  fi
              fi
          fi
          
          sudo gunzip -f ./openwrt-armvirt-64-default-rootfs.tar.gz
          
          cat << 'EOF' > inject_tmp/etc/init.d/n1_boot_check
          #!/bin/sh /etc/rc.common
          START=99
          start() {
              (
                  sleep 5
                  ROOT_DEV=$(df -h / | tail -n1 | awk '{print $1}')
                  IS_EMMC=0
                  if echo "$ROOT_DEV" | grep -q "mmcblk"; then
                      IS_EMMC=1
                  fi
          
                  if [ -f /usr/lib/adg_core/AdGuardHome ]; then
                      if [ "$IS_EMMC" = "1" ] && [ -d /mnt/mmcblk2p4 ]; then
                          DATA_DIR="/mnt/mmcblk2p4/AdGuardHome"
                          mkdir -p "$DATA_DIR"
                          cp -n /usr/lib/adg_core/AdGuardHome "$DATA_DIR/AdGuardHome"
                          chmod 755 "$DATA_DIR/AdGuardHome"
                          rm -rf /usr/bin/AdGuardHome
                          ln -sf "$DATA_DIR" /usr/bin/AdGuardHome
                          rm -rf /usr/lib/adg_core
                          rm -rf /usr/bin/AdGuardHome_data
                      else
                          DATA_DIR="/usr/bin/AdGuardHome_data"
                          mkdir -p "$DATA_DIR"
                          cp -n /usr/lib/adg_core/AdGuardHome "$DATA_DIR/AdGuardHome"
                          chmod 755 "$DATA_DIR/AdGuardHome"
                          rm -rf /usr/bin/AdGuardHome
                          ln -sf "$DATA_DIR" /usr/bin/AdGuardHome
                      fi
                      /etc/init.d/AdGuardHome restart 2>/dev/null
                  fi
          
                  if [ "$IS_EMMC" = "1" ]; then
                      rm -f /etc/rc.d/S99n1_boot_check
                      rm -f /etc/init.d/n1_boot_check
                  fi
              ) &
          }
          EOF
          chmod +x inject_tmp/etc/init.d/n1_boot_check
          ln -sf ../init.d/n1_boot_check inject_tmp/etc/rc.d/S99n1_boot_check
          
          cat << 'EOF' > inject_tmp/etc/rc.local
          # Put your custom commands here that should be executed once
          # the system init finished. By default this file does nothing.
          exit 0
          EOF
          chmod +x inject_tmp/etc/rc.local
          
          if tar -O -xf ./openwrt-armvirt-64-default-rootfs.tar etc/os-release usr/lib/os-release etc/openwrt_release 2>/dev/null | grep -qiE '^OPENWRT_RELEASE="?LEDE' || tar -tf ./openwrt-armvirt-64-default-rootfs.tar | grep -q -E '^\.?/?root/install-to-emmc.sh$'; then
              sudo tar --delete -f ./openwrt-armvirt-64-default-rootfs.tar root/install-to-emmc.sh 2>/dev/null || true
              sudo tar --delete -f ./openwrt-armvirt-64-default-rootfs.tar ./root/install-to-emmc.sh 2>/dev/null || true
              mkdir -p inject_tmp/root
              ln -sf /usr/sbin/openwrt-install-amlogic inject_tmp/root/install-to-emmc.sh
          fi
          
          cd inject_tmp
          sudo tar -rvf ../openwrt-armvirt-64-default-rootfs.tar ./* > /dev/null 2>&1
          cd ..
          
          sudo gzip -9 ./openwrt-armvirt-64-default-rootfs.tar
          
          sudo chmod +x mk_s905d_n1.sh
          sudo ./mk_s905d_n1.sh
          
          sudo gzip -9 output/*.img

      - name: Extract Native Firmware & Sync Env (提取原生镜像并对接)
        if: env.FIRMWARE_LOWER == 'lede-native' || env.FIRMWARE_LOWER == 'istoreos'
        run: |
          mkdir -p packit/output packit/
          
          if [ "${{ env.FIRMWARE_LOWER }}" == "istoreos" ]; then
             TARGET_DIR="openwrt/bin/targets/amlogic/meson/"
             REAL_KERNEL_VER=$(ls openwrt/build_dir/target-*/linux-amlogic_meson/linux-* -d 2>/dev/null | head -n 1 | awk -F'linux-' '{print $NF}')
          else
             TARGET_DIR="openwrt/bin/targets/amlogic/mesongx/"
             REAL_KERNEL_VER=$(ls openwrt/build_dir/target-*/linux-amlogic_mesongx/linux-* -d 2>/dev/null | head -n 1 | awk -F'linux-' '{print $NF}')
          fi
          
          IMG_FILES=$(find "$TARGET_DIR" -type f -name "*.img.gz")
          
          if [ -n "$IMG_FILES" ]; then
            for img in $IMG_FILES; do
               cp "$img" packit/output/
               echo "✅ 成功提取镜像: $(basename "$img")"
            done
          else
            echo "❌ 找不到任何原生生成的 img.gz 镜像！"
            exit 1
          fi
          
          if [ -z "$REAL_KERNEL_VER" ]; then REAL_KERNEL_VER="native"; fi
          
          OPENWRT_VER="${{ inputs.source_branch }}"
          if [ "$OPENWRT_VER" == "master" ]; then OPENWRT_VER="R$(date +%y.%m.%d)"; fi
          
          echo "KERNEL_VERSION=$REAL_KERNEL_VER" >> packit/make.env
          echo "OPENWRT_VER=$OPENWRT_VER" >> packit/make.env
          echo "WHOAMI=粉墨悲欢@恩山" >> packit/make.env

      - name: Organize Release Files
        id: organize
        env:
          ZIP_PASS: ${{ secrets.ZIP_PASS }}
        run: |
          mkdir release_files
          source packit/make.env
          DATETIME=$(date +'%Y%m%d%H%M')
          
          for img in packit/output/*.img.gz; do
            ORIG_NAME=$(basename "$img")
            FORMAT_SUFFIX=""
            # 取消 ext4 后缀追加，保持命名纯净；仅针对特殊的 squashfs 打标记
            if echo "$ORIG_NAME" | grep -q -E "squashfs|sfs"; then
              FORMAT_SUFFIX="-sfs"
            fi
          
            base_name="${{ env.FIRMWARE_LOWER }}-${OPENWRT_VER}-k${KERNEL_VERSION}_${DATETIME}${FORMAT_SUFFIX}"
            new_img_name="${base_name}.img.gz"
            cp "$img" "release_files/$new_img_name"
            echo "✅ 准备发布镜像: $new_img_name"
          done
          
          if [ "${{ inputs.export_config }}" == "true" ]; then
            cp openwrt/.config "release_files/${base_name}.config"
          fi
          
          cd release_files
          
          if [ "${{ env.BUILD_LOWER }}" == "personal" ]; then
            if [ -z "$ZIP_PASS" ]; then
              echo "错误：未检测到 ZIP_PASS 密钥！为保护隐私，已强制终止打包。"
              exit 1
            fi
            echo "正在为 Personal 固件进行 7z AES-256 加密打包..."
            7z a -p"$ZIP_PASS" -mhe=on "${base_name}.7z" *
            find . -type f -not -name '*.7z' -delete
          else
            if [ "${{ inputs.export_config }}" == "true" ]; then
              echo "公共版开启了 config 导出，正在打包为无密码的 7z 压缩包..."
              7z a "${base_name}.7z" *
              find . -type f -not -name '*.7z' -delete
            fi
          fi
          
          BRANCH_NAME="${{ github.ref_name }}"
          
          if [ "$BRANCH_NAME" == "main" ] || [ "$BRANCH_NAME" == "master" ]; then
            BUILD_DATE="v${{ env.START_DATE }}"
          else
            if [[ "$BRANCH_NAME" != v* ]]; then
              BUILD_DATE="v${BRANCH_NAME}"
            else
              BUILD_DATE="${BRANCH_NAME}"
            fi
          fi
          
          if [ "${{ env.BUILD_LOWER }}" == "personal" ]; then
            TAG_NAME="personal"
          else
            TAG_NAME="${BUILD_DATE}"
          fi
          
          echo "✅ 最终设定的 Release 标签为: $TAG_NAME"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "${{ env.TAG_NAME }}"
          files: release_files/*