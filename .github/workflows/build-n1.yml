name: Build N1 Firmware
run-name: "📦 ${{ inputs.firmware_type }} ${{ inputs.source_branch }} | Kernel ${{ inputs.kernel_version }}-${{ inputs.kernel_builder == 'kernel_stable' && 'stable' || 'flippy' }} | ${{ inputs.build_type }}"

on:
  workflow_dispatch:
    inputs:
      firmware_type:
        description: '选择固件源码'
        required: true
        default: 'OpenWrt'
        type: choice
        options:
          - OpenWrt
          - ImmortalWrt
          - Lede
      build_type:
        description: '编译目标'
        required: true
        default: 'Public'
        type: choice
        options:
          - Public
          - Personal
      source_branch:
        description: '填写源码分支或 Tag (若是 lede，可直接填写 Rxx.xx.xx 当作标题)'
        required: true
        default: 'v25.12.5'
      kernel_version:
        description: '打包内核版本'
        required: true
        default: '6.18.52'
      kernel_builder:
        description: '选择内核分支'
        required: true
        default: 'kernel_flippy'
        type: choice
        options:
          - kernel_flippy
          - kernel_stable
      export_config:
        description: '是否在 Release 中附带 .config 配置文件'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Convert inputs to lowercase for scripts
        run: |
          echo "FIRMWARE_LOWER=$(echo '${{ inputs.firmware_type }}' | tr 'A-Z' 'a-z')" >> $GITHUB_ENV
          echo "BUILD_LOWER=$(echo '${{ inputs.build_type }}' | tr 'A-Z' 'a-z')" >> $GITHUB_ENV

      - name: Initialize the build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo "开始物理清理，腾出空间..."
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          
          echo "更新软件源并清理大型无用包 (Ophub 稳定逻辑)..."
          sudo apt-get -y update
          sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          
          echo "安装核心依赖 (采用 Ophub 的 22.04 动态依赖列表)..."
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2204-make-openwrt-depends)
          
          echo "重载系统守护进程 (防假死核心)..."
          sudo systemctl daemon-reload
          
          echo "清理缓存..."
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          
          sudo timedatectl set-timezone "Asia/Shanghai"
          echo "✅ 环境安装完毕！当前磁盘剩余空间："
          df -h

      - name: Clone Source Code
        run: |
          if [ "${{ env.FIRMWARE_LOWER }}" == "openwrt" ]; then
            git clone --depth 1 -b ${{ inputs.source_branch }} https://github.com/openwrt/openwrt openwrt
          elif [ "${{ env.FIRMWARE_LOWER }}" == "immortalwrt" ]; then
            git clone --depth 1 -b ${{ inputs.source_branch }} https://github.com/immortalwrt/immortalwrt openwrt
          elif [[ "${{ env.FIRMWARE_LOWER }}" == lede* ]]; then
            git clone --depth 1 -b master https://github.com/coolsnowwolf/lede openwrt
          fi

      - name: Update & Install Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a -f < /dev/null

      - name: Load Custom Plugins & Uninstall Conflicts
        env:
          FIRMWARE_TYPE: ${{ env.FIRMWARE_LOWER }}
          BUILD_TYPE: ${{ env.BUILD_LOWER }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          PPPOE_USER: ${{ secrets.PPPOE_USER }}
          PPPOE_PASS: ${{ secrets.PPPOE_PASS }}
        run: |
          cd openwrt
          chmod +x $GITHUB_WORKSPACE/scripts/diy-part2.sh
          $GITHUB_WORKSPACE/scripts/diy-part2.sh

      - name: Load Configuration
        run: |
          cp configs/${{ env.FIRMWARE_LOWER }}.config openwrt/.config
          
          # 强制关闭 Debug 调试和 GDB，大幅缩短编译时间并节省庞大的磁盘空间
          sed -i 's/CONFIG_KERNEL_DEBUG_INFO=y/# CONFIG_KERNEL_DEBUG_INFO is not set/g' openwrt/.config
          sed -i 's/CONFIG_KERNEL_DEBUG_KERNEL=y/# CONFIG_KERNEL_DEBUG_KERNEL is not set/g' openwrt/.config
          sed -i 's/CONFIG_GDB=y/# CONFIG_GDB is not set/g' openwrt/.config
          
          sed -i 's/CONFIG_TARGET_ROOTFS_PARTSIZE=.*/CONFIG_TARGET_ROOTFS_PARTSIZE=512/g' openwrt/.config
          grep -q "CONFIG_TARGET_ROOTFS_PARTSIZE=" openwrt/.config || echo "CONFIG_TARGET_ROOTFS_PARTSIZE=512" >> openwrt/.config
          
          # 💡 [防爆盘] 强制砍掉极耗空间的 Shadowsocks-Rust，用其他代理核心代替
          sed -i 's/CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client=y/# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client is not set/g' openwrt/.config
          sed -i 's/CONFIG_PACKAGE_shadowsocks-rust-sslocal=y/# CONFIG_PACKAGE_shadowsocks-rust-sslocal is not set/g' openwrt/.config
          
          if [ "${{ env.BUILD_LOWER }}" == "personal" ]; then
              # 剔除 Dockerman 及 Docker 组件
              sed -i '/CONFIG_PACKAGE_luci-app-dockerman=y/d' openwrt/.config
              sed -i '/CONFIG_PACKAGE_luci-lib-docker=y/d' openwrt/.config
              sed -i '/CONFIG_PACKAGE_docker=y/d' openwrt/.config
              sed -i '/CONFIG_PACKAGE_docker-compose=y/d' openwrt/.config
              sed -i '/CONFIG_PACKAGE_dockerd=y/d' openwrt/.config
              sed -i '/CONFIG_PACKAGE_containerd=y/d' openwrt/.config
              sed -i '/CONFIG_PACKAGE_runc=y/d' openwrt/.config
              sed -i '/CONFIG_DOCKER_NET_MACVLAN=y/d' openwrt/.config
              sed -i '/CONFIG_DOCKER_STO_EXT4=y/d' openwrt/.config
          
              # 剔除 Passwall 及其关联配置
              sed -i '/CONFIG_PACKAGE_luci-app-passwall=y/d' openwrt/.config
              sed -i '/CONFIG_PACKAGE_luci-app-passwall_/d' openwrt/.config
              sed -i '/CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y/d' openwrt/.config
          fi
          
          cd openwrt
          make defconfig

      - name: Download Package & Compile
        run: |
          cd openwrt
          
          # 💡 强行删掉所有插件库的冗余 .git 历史文件夹以防爆盘
          echo "清理冗余 .git 历史以极限榨取硬盘空间..."
          find ./feeds -type d -name ".git" -exec rm -rf {} + 2>/dev/null || true
          
          make download -j8
          make -j$(nproc) || make -j1 || make -j1 V=s

      - name: Package Firmware & Inject Private Mods
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_TOKEN }}
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
        run: |
          git clone https://github.com/unifreq/openwrt_packit packit
          cd packit
          sudo mkdir -p /opt/kernel
          sudo chown -R $USER:$GROUPS /opt/kernel
          
          if [ "${{ inputs.kernel_builder }}" == "kernel_stable" ]; then
            KERNEL_EXT=".tar.gz"; TAR_CMD="tar -xzf"
          else
            KERNEL_EXT=".tar"; TAR_CMD="tar -xf"
          fi
          wget "https://github.com/wjtyyds/amlogic-s9xxx-armbian/releases/download/${{ inputs.kernel_builder }}/${{ inputs.kernel_version }}${KERNEL_EXT}"
          $TAR_CMD ${{ inputs.kernel_version }}${KERNEL_EXT} -C /opt/kernel/
          if [ "${{ inputs.kernel_builder }}" == "kernel_stable" ]; then
            sudo mv /opt/kernel/${{ inputs.kernel_version }}/* /opt/kernel/
          fi
          REAL_KERNEL_VER=$(ls /opt/kernel/boot-* | head -n 1 | sed -e 's|.*/boot-||' -e 's/\.tar\.gz//' -e 's/\.tar//')
          
          if [[ "${{ env.FIRMWARE_LOWER }}" == lede* ]]; then
            if [ "${{ inputs.source_branch }}" != "master" ]; then
              OPENWRT_VER="${{ inputs.source_branch }}"
            else
              OPENWRT_VER="R$(date +%y.%m.%d)"
            fi
          else
            OPENWRT_VER="${{ inputs.source_branch }}"
          fi
          
          echo "KERNEL_VERSION=$REAL_KERNEL_VER" >> make.env
          echo "OPENWRT_VER=$OPENWRT_VER" >> make.env
          
          if [ "${{ env.BUILD_LOWER }}" == "personal" ]; then
            echo "WHOAMI=${{ github.repository_owner }}" >> make.env
          fi
          
          ROOTFS_FILE=$(find ../openwrt/bin/targets/ -type f -name "*-rootfs.tar.gz" | head -n 1)
          sudo mv "$ROOTFS_FILE" ./openwrt-armvirt-64-default-rootfs.tar.gz
          
          # 创建准备注入的目录
          mkdir -p inject_tmp/root inject_tmp/etc inject_tmp/usr/bin inject_tmp/usr/lib
          
          # ----------------------------------------------------
          # 💡 原生物理注入阶段 (彻底避开编译期文件冲突)
          # ----------------------------------------------------
          
          # 1. 提取官方最新 AdGuardHome 
          echo "获取 AdGuardHome 最新稳定版..."
          AGH_API="https://api.github.com/repos/AdguardTeam/AdGuardHome/releases/latest"
          AGH_URL=$(curl -s "$AGH_API" | grep "browser_download_url" | grep "linux_arm64.tar.gz" | head -n 1 | cut -d '"' -f 4)
          if [ -n "$AGH_URL" ]; then
              wget -qO /tmp/agh.tar.gz "$AGH_URL"
              mkdir -p /tmp/agh_extract
              tar -xzf /tmp/agh.tar.gz -C /tmp/agh_extract
              AGH_BIN=$(find /tmp/agh_extract -type f -name "AdGuardHome" | head -n 1)
              if [ -n "$AGH_BIN" ]; then
                  # 放入真实路径等待软链，保证 U盘可以显示版本
                  mkdir -p inject_tmp/usr/bin/AdGuardHome
                  mv "$AGH_BIN" inject_tmp/usr/bin/AdGuardHome/AdGuardHome_core
                  chmod 755 inject_tmp/usr/bin/AdGuardHome/AdGuardHome_core
              fi
          fi

          # 2. 提取最新 Lucky (暂存为 lucky_new 等待首次开机时系统覆盖)
          echo "获取 Lucky 最新版..."
          if [ "${{ env.BUILD_LOWER }}" == "public" ]; then
              LUCKY_PATTERN="Linux_arm64_wanji_docker.tar.gz"
          else
              LUCKY_PATTERN="Linux_arm64_wanji.tar.gz"
          fi
          LUCKY_API="https://api.github.com/repos/gdy666/lucky/releases/latest"
          LUCKY_URL=$(curl -s "$LUCKY_API" | grep "browser_download_url" | grep "$LUCKY_PATTERN" | head -n 1 | cut -d '"' -f 4)
          if [ -n "$LUCKY_URL" ]; then
              wget -qO /tmp/lucky.tar.gz "$LUCKY_URL"
              mkdir -p /tmp/lucky_extract
              tar -xzf /tmp/lucky.tar.gz -C /tmp/lucky_extract
              LUCKY_BIN=$(find /tmp/lucky_extract -type f -name "lucky" | head -n 1)
              if [ -n "$LUCKY_BIN" ]; then
                  mv "$LUCKY_BIN" inject_tmp/usr/bin/lucky_new
              fi
          fi

          # 3. 提取 OpenClash Meta 内核
          echo "获取 OpenClash Meta 内核..."
          mkdir -p inject_tmp/etc/openclash/core
          wget -qO /tmp/clash_meta.tar.gz "https://raw.githubusercontent.com/vernesong/OpenClash/core/master/meta/clash-linux-arm64.tar.gz" || true
          if [ -f /tmp/clash_meta.tar.gz ]; then
              mkdir -p /tmp/clash_meta_tmp
              tar -xzf /tmp/clash_meta.tar.gz -C /tmp/clash_meta_tmp/ || true
              if [ -f /tmp/clash_meta_tmp/clash ]; then
                  mv /tmp/clash_meta_tmp/clash inject_tmp/etc/openclash/core/clash_meta
                  chmod 755 inject_tmp/etc/openclash/core/clash_meta
              fi
          fi
          
          # 4. 处理 OAF 模块
          OAF_UI_VER=$(curl -s "https://api.github.com/repos/destan19/OpenAppFilter/releases/latest" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          if [[ "$OAF_UI_VER" == v7* ]]; then
              OAF_KMOD_TAG="OAF_Kmods_v7.0.1"
          else
              OAF_KMOD_TAG="OAF_Kmods_v6.1.8"
          fi
          if [ -n "$PRIVATE_REPO" ]; then
              gh release download "$OAF_KMOD_TAG" -R "$PRIVATE_REPO" -p "oaf-${REAL_KERNEL_VER}.tar.gz" --clobber > /dev/null 2>&1 || true
          fi
          if [ ! -f "oaf-${REAL_KERNEL_VER}.tar.gz" ] && [ -f "../auto_import/oaf-${REAL_KERNEL_VER}.tar.gz" ]; then
              cp "../auto_import/oaf-${REAL_KERNEL_VER}.tar.gz" ./ || true
          fi
          if [ -f "oaf-${REAL_KERNEL_VER}.tar.gz" ]; then
              tar -xzf "oaf-${REAL_KERNEL_VER}.tar.gz" -C inject_tmp/root/ 2>/dev/null || true
              find inject_tmp/root/ -type f -name "oaf.ko" -exec mv {} inject_tmp/root/oaf.ko \; 2>/dev/null || true
              find inject_tmp/root/ -type d -empty -delete 2>/dev/null || true
          fi
          
          # 5. 私密配置解压注入
          if [ "${{ env.BUILD_LOWER }}" == "personal" ]; then
              if [ -n "$PRIVATE_REPO" ]; then
                  gh release download "Private-Configs" -R "$PRIVATE_REPO" -p "private_config.zip" --clobber > /dev/null 2>&1 || true
                  if [ -f "private_config.zip" ]; then
                      mkdir -p private_conf_tmp
                      unzip -q "private_config.zip" -d private_conf_tmp/ || true
          
                      if [ -f "private_conf_tmp/AdGuardHome.yaml" ]; then
                          mkdir -p inject_tmp/etc
                          mv private_conf_tmp/AdGuardHome.yaml inject_tmp/etc/AdGuardHome.yaml || true
                      fi
                      LUCKY_ZIP=$(ls private_conf_tmp/lucky_*.zip 2>/dev/null | head -n 1)
                      if [ -n "$LUCKY_ZIP" ]; then
                          mkdir -p inject_tmp/etc/config/lucky.daji
                          unzip -q -o "$LUCKY_ZIP" -d inject_tmp/etc/config/lucky.daji/ || true
                      fi
                      rm -rf private_conf_tmp private_config.zip
                  fi
              fi
          fi
          
          sudo gunzip -f ./openwrt-armvirt-64-default-rootfs.tar.gz
          
          # 💡 极简纯净的 rc.local
          cat << 'EOF' > inject_tmp/etc/rc.local
          # Put your custom commands here that should be executed once
          # the system init finished. By default this file does nothing.
          
          exit 0
          EOF
          chmod +x inject_tmp/etc/rc.local
          
          if tar -O -xf ./openwrt-armvirt-64-default-rootfs.tar etc/os-release usr/lib/os-release etc/openwrt_release 2>/dev/null | grep -qiE '^OPENWRT_RELEASE="?LEDE' || tar -tf ./openwrt-armvirt-64-default-rootfs.tar | grep -q -E '^\.?/?root/install-to-emmc.sh$'; then
              sudo tar --delete -f ./openwrt-armvirt-64-default-rootfs.tar root/install-to-emmc.sh 2>/dev/null || true
              sudo tar --delete -f ./openwrt-armvirt-64-default-rootfs.tar ./root/install-to-emmc.sh 2>/dev/null || true
              mkdir -p inject_tmp/root
              ln -sf /usr/sbin/openwrt-install-amlogic inject_tmp/root/install-to-emmc.sh
          fi
          
          cd inject_tmp
          sudo tar -rvf ../openwrt-armvirt-64-default-rootfs.tar ./* > /dev/null 2>&1
          
          # 💡 [去重] 强行修复可能重复的 balethirq.pl 逻辑
          mkdir -p /tmp/rc_fix
          cd /tmp/rc_fix
          sudo tar -xf $GITHUB_WORKSPACE/packit/openwrt-armvirt-64-default-rootfs.tar etc/rc.local || true
          if [ -f etc/rc.local ]; then
              sudo sed -i '/balethirq.pl/d' etc/rc.local
              sudo sed -i '/exit 0/i \/usr\/sbin\/balethirq.pl' etc/rc.local
              sudo tar -rvf $GITHUB_WORKSPACE/packit/openwrt-armvirt-64-default-rootfs.tar etc/rc.local > /dev/null 2>&1
          fi
          
          cd $GITHUB_WORKSPACE/packit
          sudo gzip -9 ./openwrt-armvirt-64-default-rootfs.tar
          
          sudo chmod +x mk_s905d_n1.sh
          sudo ./mk_s905d_n1.sh
          
          sudo gzip -9 output/*.img

      - name: Organize Release Files
        id: organize
        env:
          ZIP_PASS: ${{ secrets.ZIP_PASS }}
        run: |
          mkdir release_files
          
          source packit/make.env
          
          DATETIME=$(date +'%Y%m%d%H%M')
          
          for img in packit/output/*.img.gz; do
            base_name="${{ env.FIRMWARE_LOWER }}-${OPENWRT_VER}-k${KERNEL_VERSION}-${DATETIME}"
            new_img_name="${base_name}.img.gz"
            cp "$img" "release_files/$new_img_name"
          done
          
          if [ "${{ inputs.export_config }}" == "true" ]; then
            cp openwrt/.config "release_files/${base_name}.config"
          fi
          
          cd release_files
          
          if [ "${{ env.BUILD_LOWER }}" == "personal" ]; then
            if [ -z "$ZIP_PASS" ]; then
              echo "错误：未检测到 ZIP_PASS 密钥！为保护隐私，已强制终止打包。"
              exit 1
            fi
            echo "正在为 Personal 固件进行 7z AES-256 加密打包..."
            7z a -p"$ZIP_PASS" -mhe=on "${base_name}.7z" *
            find . -type f -not -name '*.7z' -delete
          else
            if [ "${{ inputs.export_config }}" == "true" ]; then
              echo "公共版开启了 config 导出，正在打包为无密码的 7z 压缩包..."
              7z a "${base_name}.7z" *
              find . -type f -not -name '*.7z' -delete
            fi
          fi
          
          FW_PREFIX="${{ inputs.firmware_type }}"
          
          if [[ "$FW_PREFIX" == Lede* ]]; then
            TAG_NAME="${FW_PREFIX}-${{ inputs.build_type }}"
          else
            if [[ "$OPENWRT_VER" == *.* ]]; then
              BASE_VER="${OPENWRT_VER%.*}.x"
            else
              BASE_VER="$OPENWRT_VER"
            fi
            TAG_NAME="${FW_PREFIX}-${BASE_VER}-${{ inputs.build_type }}"
          fi
          
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "🚀 ${{ env.TAG_NAME }}"
          files: release_files/*