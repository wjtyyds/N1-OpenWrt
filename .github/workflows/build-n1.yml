name: Build N1 Firmware
run-name: "📦 ${{ inputs.firmware_type }} | ${{ inputs.source_branch }}${{ inputs.custom_tag != '' && format(' | {0}', inputs.custom_tag) || '' }}${{ inputs.firmware_type != 'Lede-Native' && inputs.firmware_type != 'iStoreOS' && format(' | {0}-{1}', inputs.kernel_version, inputs.kernel_builder == 'kernel_stable' && 'stable' || 'flippy') || '' }}${{ inputs.build_type == 'Personal' && ' | Personal' || '' }}${{ inputs.build_note != '' && format(' | {0}', inputs.build_note) || '' }}"
on:
  workflow_dispatch:
    inputs:
      firmware_type:
        description: '选择固件源码'
        required: true
        default: 'OpenWrt'
        type: choice
        options:
          - OpenWrt
          - ImmortalWrt
          - Lede
          - Lede-Native
          - iStoreOS
      build_type:
        description: '编译目标'
        required: true
        default: 'Public'
        type: choice
        options:
          - Public
          - Personal
      source_branch:
        description: '填写源码分支或 Tag (若是 lede，可直接填写 master 当作分支)'
        required: true
        default: 'v25.12.5'
      kernel_version:
        description: '打包内核版本 (注：若是原生编译则无需理会此项)'
        required: true
        default: '6.18.57'
      kernel_builder:
        description: '选择内核分支 (注：若是原生编译则无需理会此项)'
        required: true
        default: 'kernel_flippy'
        type: choice
        options:
          - kernel_flippy
          - kernel_stable
      custom_tag:
        description: '附加显示标签 (例如: R26.10.15，仅作标题显示和触发时光机)'
        required: false
        default: ''
      build_note:
        description: '编译备注 (直接附加在流水线名称与固件名末尾，例如填写: 测试Lucky新规则)'
        required: false
        default: ''
      export_config:
        description: '是否在 Release 中附带 .config 配置文件'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Convert inputs to lowercase for scripts
        run: |
          echo "FIRMWARE_LOWER=$(echo '${{ inputs.firmware_type }}' | tr 'A-Z' 'a-z')" >> $GITHUB_ENV
          echo "BUILD_LOWER=$(echo '${{ inputs.build_type }}' | tr 'A-Z' 'a-z')" >> $GITHUB_ENV

      - name: Initialize the build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo "开始物理清理，腾出空间..."
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          
          echo "更新软件源并清理大型无用包..."
          sudo apt-get -y update
          sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          
          echo "安装核心依赖..."
          sudo apt-get -y install clang llvm jq dwarves libelf-dev $(curl -fsSL https://ophub.org/ubuntu2204-make-openwrt-depends)
          
          echo "重载系统守护进程..."
          sudo systemctl daemon-reload
          
          echo "清理缓存..."
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          
          sudo timedatectl set-timezone "Asia/Shanghai"
          
          echo "START_DATE=$(date +'%Y.%m.%d')" >> $GITHUB_ENV
          echo "✅ 环境安装完毕！"

      - name: Clone Source Code
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_TOKEN }}
        run: |
          CUSTOM_TAG="${{ inputs.custom_tag }}"
          
          if [ "${{ env.FIRMWARE_LOWER }}" == "openwrt" ]; then
            REPO_URL="https://github.com/openwrt/openwrt"
            TARGET_BRANCH="${{ inputs.source_branch }}"
          
          elif [ "${{ env.FIRMWARE_LOWER }}" == "immortalwrt" ]; then
            REPO_URL="https://github.com/immortalwrt/immortalwrt"
            TARGET_BRANCH="${{ inputs.source_branch }}"
          
          elif [ "${{ env.FIRMWARE_LOWER }}" == "istoreos" ]; then
            REPO_URL="https://github.com/istoreos/istoreos.git"
            BASE_BRANCH="${{ inputs.source_branch }}"
          
            if [[ "$CUSTOM_TAG" =~ ^R([0-9]{2})\.([0-9]{2})\.([0-9]{2})$ ]]; then
              YEAR="20${BASH_REMATCH[1]}"
              MONTH="${BASH_REMATCH[2]}"
              DAY="${BASH_REMATCH[3]}"
              TARGET_DATE="${YEAR}-${MONTH}-${DAY}T15:59:59Z"
              echo "TARGET_DATE_ISO=$TARGET_DATE" >> $GITHUB_ENV
              echo "TARGET_DATE_SIMPLE=20${BASH_REMATCH[1]}.${MONTH}.${DAY}" >> $GITHUB_ENV
          
              echo "⏳ 触发 iStoreOS 时光机：正在查找 $BASE_BRANCH 分支在 $TARGET_DATE 之前的最后一次提交..."
              API_URL="https://api.github.com/repos/istoreos/istoreos/commits?sha=$BASE_BRANCH&until=$TARGET_DATE&per_page=1"
              API_RESP=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "$API_URL")
              TARGET_BRANCH=$(echo "$API_RESP" | jq -r '.[0].sha' 2>/dev/null)
          
              if [ "$TARGET_BRANCH" == "null" ] || [ -z "$TARGET_BRANCH" ]; then
                echo "⚠️ 时光机未找到符合条件的提交，将拉取分支的最新代码！"
                TARGET_BRANCH="$BASE_BRANCH"
              fi
            else
              TARGET_BRANCH="$BASE_BRANCH"
            fi
          
          elif [[ "${{ env.FIRMWARE_LOWER }}" == lede* ]]; then
            REPO_URL="https://github.com/coolsnowwolf/lede"
          
            if [[ "$CUSTOM_TAG" =~ ^R([0-9]{2})\.([0-9]{2})\.([0-9]{2})$ ]]; then
              YEAR="20${BASH_REMATCH[1]}"
              MONTH="${BASH_REMATCH[2]}"
              DAY="${BASH_REMATCH[3]}"
              TARGET_DATE="${YEAR}-${MONTH}-${DAY}T15:59:59Z"
              echo "TARGET_DATE_ISO=$TARGET_DATE" >> $GITHUB_ENV
              echo "TARGET_DATE_SIMPLE=20${BASH_REMATCH[1]}.${MONTH}.${DAY}" >> $GITHUB_ENV
          
              echo "⏳ 触发 Lede 时光机：查找 ${{ inputs.source_branch }} 分支在 $TARGET_DATE 之前的最后一次提交..."
              API_URL="https://api.github.com/repos/coolsnowwolf/lede/commits?sha=${{ inputs.source_branch }}&until=$TARGET_DATE&per_page=1"
              API_RESP=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "$API_URL")
              TARGET_BRANCH=$(echo "$API_RESP" | jq -r '.[0].sha' 2>/dev/null)
          
              if [ "$TARGET_BRANCH" == "null" ] || [ -z "$TARGET_BRANCH" ]; then
                TARGET_BRANCH="${{ inputs.source_branch }}"
              fi
            else
              TARGET_BRANCH="${{ inputs.source_branch }}"
            fi
          fi
          
          if [ -n "$CUSTOM_TAG" ] && [[ "${{ env.FIRMWARE_LOWER }}" != lede* ]] && [ "${{ env.FIRMWARE_LOWER }}" != "istoreos" ]; then
              if [[ "$CUSTOM_TAG" =~ ^R([0-9]{2})\.([0-9]{2})\.([0-9]{2})$ ]]; then
                  YEAR="20${BASH_REMATCH[1]}"
                  MONTH="${BASH_REMATCH[2]}"
                  DAY="${BASH_REMATCH[3]}"
                  echo "TARGET_DATE_ISO=${YEAR}-${MONTH}-${DAY}T23:59:59Z" >> $GITHUB_ENV
                  echo "TARGET_DATE_ISO=${YEAR}-${MONTH}-${DAY}T15:59:59Z" >> $GITHUB_ENV
              fi
          fi
          
          echo "开始精准锁定指定的 Tag/Branch/Hash: $TARGET_BRANCH"
          mkdir openwrt && cd openwrt
          git init
          git remote add origin $REPO_URL
          git fetch --depth 1 origin "$TARGET_BRANCH"
          git checkout FETCH_HEAD
          
          CURRENT_HASH=$(git log -1 --format="%h")
          echo "✅ 源码已成功锁定至哈希: $CURRENT_HASH"
          
          sed -i 's/^src-git helloworld/#src-git helloworld/g' feeds.conf.default

      - name: Update & Install Feeds
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_TOKEN }}
        run: |
          if [ "${{ env.FIRMWARE_LOWER }}" == "istoreos" ]; then
            if [[ "${{ inputs.source_branch }}" =~ ^(istoreos-[0-9]+\.[0-9]+) ]]; then
              BASE_FEED_VER="${BASH_REMATCH[1]}"
              TARGET_FEEDS="configs/feeds_${BASE_FEED_VER}.conf"
            else
              TARGET_FEEDS="configs/feeds_${{ inputs.source_branch }}.conf"
            fi
          
            DEFAULT_FEEDS="configs/feeds_istoreos.conf"
          
            if [ -f "$TARGET_FEEDS" ]; then
              echo "====== 匹配到分支专属 feeds 配置，开始注入: $TARGET_FEEDS ======"
              cp "$TARGET_FEEDS" openwrt/feeds.conf
            elif [ -f "$DEFAULT_FEEDS" ]; then
              echo "====== 未匹配到专属文件，使用兜底 feeds 配置: $DEFAULT_FEEDS ======"
              cp "$DEFAULT_FEEDS" openwrt/feeds.conf
            else
              echo "====== 未找到任何自定义 feeds 配置，保持源码默认状态 ======"
            fi
          fi
          
          cd openwrt
          
          if [ -n "$TARGET_DATE_ISO" ] && [ -f feeds.conf ]; then
              echo "⏳ 触发 Feeds 时光机，准备解析 feeds.conf (目标日期: $TARGET_DATE_ISO)..."
          
              FEED_REGEX="^src-git[[:space:]]+([a-zA-Z0-9_.-]+)[[:space:]]+([^;]+);(.*)$"
          
              while IFS= read -r line; do
                  [[ -z "$line" || "$line" == \#* ]] && continue
          
                  if [[ "$line" =~ $FEED_REGEX ]]; then
                      feed_name="${BASH_REMATCH[1]}"
                      repo_url="${BASH_REMATCH[2]}"
                      branch_name="${BASH_REMATCH[3]}"
          
                      echo "- 正在查询 [$feed_name] ($repo_url, 分支: $branch_name) 在 $TARGET_DATE_ISO 之前的 Hash..."
          
                      repo_path=$(echo "$repo_url" | sed -E 's|https://github.com/([^/]+/[^/.]+)(\.git)?|\1|')
          
                      api_url="https://api.github.com/repos/$repo_path/commits?sha=$branch_name&until=$TARGET_DATE_ISO&per_page=1"
                      api_resp=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "$api_url")
                      commit_hash=$(echo "$api_resp" | jq -r '.[0].sha' 2>/dev/null)
          
                      if [ "$commit_hash" != "null" ] && [ -n "$commit_hash" ]; then
                          short_hash=${commit_hash:0:7}
                          echo "  ✅ 成功获取到 Hash: $short_hash"
                          escaped_url=$(echo "$repo_url" | sed 's/[./*?|]/\\&/g')
                          sed -i "s|^src-git[[:space:]]*$feed_name[[:space:]]*$escaped_url;$branch_name$|src-git $feed_name $repo_url^$commit_hash|g" feeds.conf
                      else
                          echo "  ⚠️ 获取 Hash 失败，保持原样 ($branch_name)。"
                      fi
                  fi
              done < feeds.conf
              echo "====== Feeds 时光机处理完毕 ======"
              cat feeds.conf
          fi
          
          ./scripts/feeds update -a
          ./scripts/feeds install -a -f < /dev/null

      - name: Load Custom Plugins & Uninstall Conflicts
        env:
          FIRMWARE_TYPE: ${{ env.FIRMWARE_LOWER }}
          BUILD_TYPE: ${{ env.BUILD_LOWER }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          PPPOE_USER: ${{ secrets.PPPOE_USER }}
          PPPOE_PASS: ${{ secrets.PPPOE_PASS }}
          GH_TOKEN: ${{ secrets.PRIVATE_TOKEN }}
          TARGET_DATE_ISO: ${{ env.TARGET_DATE_ISO }}
          TARGET_DATE_SIMPLE: ${{ env.TARGET_DATE_SIMPLE }}
        run: |
          cd openwrt
          chmod +x $GITHUB_WORKSPACE/scripts/diy-part2.sh
          $GITHUB_WORKSPACE/scripts/diy-part2.sh

      - name: Load Configuration
        run: |
          CONF_NAME="${{ env.FIRMWARE_LOWER }}"
          
          if [ ! -f "configs/${CONF_NAME}.config" ] && [[ "${CONF_NAME}" == "lede-native" ]]; then
            echo "未找到 lede-native.config，降级使用共用的 lede.config..."
            cp configs/lede.config openwrt/.config
          else
            echo "加载配置文件: configs/${CONF_NAME}.config"
            cp configs/${CONF_NAME}.config openwrt/.config
          fi
          
          sed -i 's/CONFIG_KERNEL_DEBUG_INFO=y/# CONFIG_KERNEL_DEBUG_INFO is not set/g' openwrt/.config
          sed -i 's/CONFIG_KERNEL_DEBUG_KERNEL=y/# CONFIG_KERNEL_DEBUG_KERNEL is not set/g' openwrt/.config
          sed -i 's/CONFIG_GDB=y/# CONFIG_GDB is not set/g' openwrt/.config
          sed -i 's/CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client=y/# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client is not set/g' openwrt/.config
          sed -i 's/CONFIG_PACKAGE_shadowsocks-rust-sslocal=y/# CONFIG_PACKAGE_shadowsocks-rust-sslocal is not set/g' openwrt/.config
          echo "CONFIG_DEVEL=y" >> openwrt/.config
          echo "CONFIG_BPF_TOOLCHAIN_HOST=y" >> openwrt/.config

          echo "====== 注入全局基础定制插件 ======"
          cat >> openwrt/.config <<EOF
          CONFIG_PACKAGE_luci-theme-aurora=y
          CONFIG_PACKAGE_luci-app-aurora-config=y
          CONFIG_PACKAGE_luci-app-adguardhome=y
          CONFIG_PACKAGE_luci-app-lucky=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-oaf=y
          EOF

          if [[ "${CONF_NAME}" == lede* ]]; then
            if [ "${CONF_NAME}" == "lede-native" ]; then
              sed -i 's/CONFIG_LINUX_6_18=y/# CONFIG_LINUX_6_18 is not set/g' openwrt/.config
              sed -i 's/CONFIG_LINUX_6_12=y/# CONFIG_LINUX_6_12 is not set/g' openwrt/.config
              echo "CONFIG_LINUX_6_6=y" >> openwrt/.config
              sed -i 's/CONFIG_PACKAGE_brcmfmac-firmware-usb=y/# CONFIG_PACKAGE_brcmfmac-firmware-usb is not set/g' openwrt/.config
              sed -i 's/CONFIG_BRCMFMAC_USB=y/# CONFIG_BRCMFMAC_USB is not set/g' openwrt/.config
            elif [ "${CONF_NAME}" == "lede" ]; then
              sed -i 's/# CONFIG_TARGET_ROOTFS_TARGZ is not set/CONFIG_TARGET_ROOTFS_TARGZ=y/g' openwrt/.config
              echo "CONFIG_TARGET_ROOTFS_TARGZ=y" >> openwrt/.config
              sed -i 's/CONFIG_TARGET_ROOTFS_EXT4FS=y/# CONFIG_TARGET_ROOTFS_EXT4FS is not set/g' openwrt/.config
              sed -i 's/CONFIG_TARGET_ROOTFS_SQUASHFS=y/# CONFIG_TARGET_ROOTFS_SQUASHFS is not set/g' openwrt/.config
              sed -i '/CONFIG_TARGET_EXT4_/d' openwrt/.config
              sed -i '/CONFIG_TARGET_IMAGES_GZIP/d' openwrt/.config
              sed -i '/CONFIG_TARGET_ROOTFS_PARTSIZE/d' openwrt/.config
            fi
          
            sed -i 's/CONFIG_PACKAGE_libustream-openssl=y/# CONFIG_PACKAGE_libustream-openssl is not set/g' openwrt/.config
            sed -i 's/CONFIG_DEFAULT_libustream-openssl=y/# CONFIG_DEFAULT_libustream-openssl is not set/g' openwrt/.config
            cat >> openwrt/.config <<EOF
          CONFIG_PACKAGE_libustream-mbedtls=y
          CONFIG_DEFAULT_libustream-mbedtls=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ca-certificates=y
          EOF

          elif [ "${CONF_NAME}" == "openwrt" ]; then
            cat >> openwrt/.config <<EOF
          CONFIG_PACKAGE_luci-app-diskman=y
          CONFIG_PACKAGE_luci-app-diskman_INCLUDE_lsblk=y
          CONFIG_PACKAGE_luci-app-turboacc=y
          CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_OFFLOADING=y
          CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_BBR_CCA=y
          CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_NFT_FULLCONE=y
          EOF
          fi

          if [ "${{ env.BUILD_LOWER }}" == "public" ]; then
            echo "====== 注入 Public 科学套件 ======"
          
            if [[ "${{ env.TARGET_DATE_SIMPLE }}" != "2026.09.09" ]]; then
              cat >> openwrt/.config <<EOF
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Geoview=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Haproxy=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Hysteria=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Client=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Geodata=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Plugin=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray_Plugin=y
          EOF
              if [[ "${CONF_NAME}" == lede* ]]; then
                 echo "CONFIG_PACKAGE_luci-app-passwall_Iptables_Transparent_Proxy=y" >> openwrt/.config
              else
                 echo "CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy=y" >> openwrt/.config
              fi
            fi

            if [[ "${{ env.TARGET_DATE_SIMPLE }}" != "2026.09.09" ]] && [[ "${{ env.TARGET_DATE_SIMPLE }}" != "2026.09.16" ]]; then
              cat >> openwrt/.config <<EOF
          CONFIG_PACKAGE_luci-app-daede=y
          CONFIG_PACKAGE_dae=y
          EOF
            fi

          elif [ "${{ env.BUILD_LOWER }}" == "personal" ]; then
            echo "====== 开始注入 Personal 版本专属强效断根指令 ======"
            sed -i 's/CONFIG_PACKAGE_luci-app-dockerman=y/# CONFIG_PACKAGE_luci-app-dockerman is not set/g' openwrt/.config
            sed -i 's/CONFIG_PACKAGE_luci-lib-docker=y/# CONFIG_PACKAGE_luci-lib-docker is not set/g' openwrt/.config
            sed -i 's/CONFIG_PACKAGE_docker=y/# CONFIG_PACKAGE_docker is not set/g' openwrt/.config
            sed -i 's/CONFIG_PACKAGE_docker-compose=y/# CONFIG_PACKAGE_docker-compose is not set/g' openwrt/.config
            sed -i 's/CONFIG_PACKAGE_dockerd=y/# CONFIG_PACKAGE_dockerd is not set/g' openwrt/.config
            sed -i 's/CONFIG_PACKAGE_containerd=y/# CONFIG_PACKAGE_containerd is not set/g' openwrt/.config
            sed -i 's/CONFIG_PACKAGE_runc=y/# CONFIG_PACKAGE_runc is not set/g' openwrt/.config
            sed -i 's/CONFIG_DOCKER_NET_MACVLAN=y/# CONFIG_DOCKER_NET_MACVLAN is not set/g' openwrt/.config
            sed -i 's/CONFIG_DOCKER_STO_EXT4=y/# CONFIG_DOCKER_STO_EXT4 is not set/g' openwrt/.config
          fi
          
          cd openwrt
          make defconfig

      - name: Inject Binaries & Configs (原生编译前置注入)
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_TOKEN }}
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
          BUILD_LOWER: ${{ env.BUILD_LOWER }}
          TARGET_DATE_ISO: ${{ env.TARGET_DATE_ISO }}
        run: |
          echo "====== 原生编译：前置注入最新内核与私密配置 ======"
          BASE_FILES="openwrt/package/base-files/files"
          mkdir -p $BASE_FILES/usr/lib/adg_core
          mkdir -p $BASE_FILES/usr/bin
          mkdir -p $BASE_FILES/etc/openclash/core
          mkdir -p $BASE_FILES/etc/init.d
          mkdir -p $BASE_FILES/etc/rc.d
          
          echo "提取官方 AdGuardHome (融入时光机，且强制稳定版)..."
          if [ -n "$TARGET_DATE_ISO" ]; then
              AGH_API="https://api.github.com/repos/AdguardTeam/AdGuardHome/releases?per_page=50"
              AGH_URL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "$AGH_API" | jq -r --arg date "$TARGET_DATE_ISO" 'map(select(.published_at < $date and .prerelease == false)) | .[0].assets[] | select(.name | contains("linux_arm64.tar.gz")) | .browser_download_url' | head -n 1)
          else
              AGH_API="https://api.github.com/repos/AdguardTeam/AdGuardHome/releases/latest"
              AGH_URL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "$AGH_API" | grep "browser_download_url" | grep "linux_arm64.tar.gz" | head -n 1 | cut -d '"' -f 4)
          fi
          
          if [ -n "$AGH_URL" ] && [ "$AGH_URL" != "null" ]; then
              echo "✅ 锁定 AdGuardHome 稳定版链接: $AGH_URL"
              wget -qO /tmp/agh.tar.gz "$AGH_URL"
              tar -xzf /tmp/agh.tar.gz -C /tmp/
              mv /tmp/AdGuardHome/AdGuardHome $BASE_FILES/usr/lib/adg_core/
              chmod 755 $BASE_FILES/usr/lib/adg_core/AdGuardHome
          fi
          
          echo "提取 Lucky 并进行源码级劫持..."
          mkdir -p openwrt/custom_bins
          if [ "$BUILD_LOWER" == "public" ]; then
            LUCKY_FILE="lucky_2.27.2_Linux_arm64_wanji_docker.tar.gz"
          else
            LUCKY_FILE="lucky_2.27.2_Linux_arm64_wanji.tar.gz"
          fi
          
          if [ -n "$PRIVATE_REPO" ]; then
            gh release download "Private-Configs" -R "$PRIVATE_REPO" -p "$LUCKY_FILE" --clobber >/dev/null 2>&1 || true
          fi
          
          if [ -f "$LUCKY_FILE" ]; then
            tar -xzf "$LUCKY_FILE" -C /tmp/
            mv $(find /tmp/ -type f -name "lucky" | head -n 1) openwrt/custom_bins/lucky
            chmod 755 openwrt/custom_bins/lucky
            sed -i 's|$(PKG_BUILD_DIR)[^ ]*lucky|$(TOPDIR)/custom_bins/lucky|g' openwrt/package/custom/lucky/lucky/Makefile
          fi
          
          echo "提取 OpenClash Meta (融入时光机)..."
          if [ -n "$TARGET_DATE_ISO" ]; then
              CORE_HASH=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/vernesong/OpenClash/commits?sha=core&until=$TARGET_DATE_ISO&per_page=1" | jq -r '.[0].sha')
              if [ "$CORE_HASH" == "null" ] || [ -z "$CORE_HASH" ]; then CORE_HASH="core"; fi
          else
              CORE_HASH="core"
          fi
          
          META_URL="https://raw.githubusercontent.com/vernesong/OpenClash/${CORE_HASH}/master/meta/clash-linux-arm64.tar.gz"
          echo "✅ 锁定 Meta Core 链接: $META_URL"
          wget -qO /tmp/clash_meta.tar.gz "$META_URL" || true
          if [ -f /tmp/clash_meta.tar.gz ]; then
              tar -xzf /tmp/clash_meta.tar.gz -C /tmp/ || true
              mv /tmp/clash $BASE_FILES/etc/openclash/core/clash_meta || true
              chmod 755 $BASE_FILES/etc/openclash/core/clash_meta || true
          fi
          
          if [ "$BUILD_LOWER" == "personal" ]; then
              echo "解压私有配置..."
              if [ -n "$PRIVATE_REPO" ]; then
                  gh release download "Private-Configs" -R "$PRIVATE_REPO" -p "private_config.zip" --clobber >/dev/null 2>&1 || true
                  if [ -f "private_config.zip" ]; then
                      unzip -q "private_config.zip" -d /tmp/private_conf/ || true
                      [ -f "/tmp/private_conf/AdGuardHome.yaml" ] && mv /tmp/private_conf/AdGuardHome.yaml $BASE_FILES/etc/
                      LUCKY_ZIP=$(ls /tmp/private_conf/lucky_*.zip 2>/dev/null | head -n 1)
                      if [ -n "$LUCKY_ZIP" ]; then
                          mkdir -p $BASE_FILES/etc/config/lucky.daji
                          unzip -q -o "$LUCKY_ZIP" -d $BASE_FILES/etc/config/lucky.daji/
                      fi
                  fi
              fi
          fi
          
          echo "注入 AdGuardHome 引导脚本..."
          cat << 'EOF' > $BASE_FILES/etc/init.d/sys_env_init
          #!/bin/sh /etc/rc.common
          START=99
          start() {
              (
                  sleep 5
                  IS_EMMC=0
                  if mount | grep -E 'on /boot |on /rom |on / ' | grep -q "mmcblk"; then
                    IS_EMMC=1
                  fi
          
                  if [ -f /usr/lib/adg_core/AdGuardHome ]; then
                      if [ "$IS_EMMC" = "1" ] && [ -d /mnt/mmcblk2p4 ]; then
                          DATA_DIR="/mnt/mmcblk2p4/AdGuardHome"
                          mkdir -p "$DATA_DIR"
                          cp -n /usr/lib/adg_core/AdGuardHome "$DATA_DIR/AdGuardHome"
                          chmod 755 "$DATA_DIR/AdGuardHome"
                          rm -rf /usr/bin/AdGuardHome
                          ln -sf "$DATA_DIR" /usr/bin/AdGuardHome
                          rm -rf /usr/lib/adg_core
                          rm -rf /usr/bin/AdGuardHome_data
                      else
                          DATA_DIR="/usr/bin/AdGuardHome_data"
                          mkdir -p "$DATA_DIR"
                          cp -n /usr/lib/adg_core/AdGuardHome "$DATA_DIR/AdGuardHome"
                          chmod 755 "$DATA_DIR/AdGuardHome"
                          rm -rf /usr/bin/AdGuardHome
                          ln -sf "$DATA_DIR" /usr/bin/AdGuardHome
                      fi
                      /etc/init.d/AdGuardHome restart 2>/dev/null
                  fi
                  if [ "$IS_EMMC" = "1" ]; then
                      rm -f /etc/rc.d/S99sys_env_init
                      rm -f /etc/init.d/sys_env_init
                  fi
              ) &
          }
          EOF
          chmod +x $BASE_FILES/etc/init.d/sys_env_init
          ln -sf ../init.d/sys_env_init $BASE_FILES/etc/rc.d/S99sys_env_init
          
          cat << 'EOF' > $BASE_FILES/etc/rc.local
          # Put your custom commands here that should be executed once
          # the system init finished. By default this file does nothing.
          exit 0
          EOF
          chmod +x $BASE_FILES/etc/rc.local
          
          if [ "$FIRMWARE_LOWER" == "istoreos" ]; then
              echo "为 iStoreOS 创建 /root/install-to-emmc.sh 软链接..."
              mkdir -p $BASE_FILES/root
              ln -sf /usr/sbin/install-to-emmc.sh $BASE_FILES/root/install-to-emmc.sh
          fi

      - name: Download Package & Compile
        run: |
          cd openwrt
          make download -j8
          make -j$(nproc) || make -j1 || make -j1 V=s

      - name: Package Firmware & Inject Private Mods
        if: env.FIRMWARE_LOWER != 'lede-native' && env.FIRMWARE_LOWER != 'istoreos'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_TOKEN }}
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
        run: |
          git clone https://github.com/unifreq/openwrt_packit packit
          cd packit
          sudo mkdir -p /opt/kernel
          sudo chown -R $USER:$GROUPS /opt/kernel
          
          if [ "${{ inputs.kernel_builder }}" == "kernel_stable" ]; then
            KERNEL_EXT=".tar.gz"; TAR_CMD="tar -xzf"
          else
            KERNEL_EXT=".tar"; TAR_CMD="tar -xf"
          fi
          wget "https://github.com/wjtyyds/amlogic-s9xxx-armbian/releases/download/${{ inputs.kernel_builder }}/${{ inputs.kernel_version }}${KERNEL_EXT}"
          $TAR_CMD ${{ inputs.kernel_version }}${KERNEL_EXT} -C /opt/kernel/
          if [ "${{ inputs.kernel_builder }}" == "kernel_stable" ]; then
            sudo mv /opt/kernel/${{ inputs.kernel_version }}/* /opt/kernel/
          fi
          
          # 获取内核全名 (提取 boot- 后面的所有字符)
          REAL_KERNEL_VER=$(ls /opt/kernel/boot-* | head -n 1 | sed -e 's|.*/boot-||' -e 's/\.tar\.gz//' -e 's/\.tar//')
          
          if [[ "${{ env.FIRMWARE_LOWER }}" == lede* ]]; then
            if [ "${{ inputs.source_branch }}" != "master" ]; then
              OPENWRT_VER="${{ inputs.source_branch }}"
            else
              OPENWRT_VER="R$(date +%y.%m.%d)"
            fi
          else
            OPENWRT_VER="${{ inputs.source_branch }}"
          fi
          
          echo "KERNEL_VERSION=$REAL_KERNEL_VER" >> make.env
          echo "OPENWRT_VER=$OPENWRT_VER" >> make.env
          echo "WHOAMI=粉墨悲欢@恩山" >> make.env
          
          ROOTFS_FILE=$(find ../openwrt/bin/targets/ -type f -name "*-rootfs.tar.gz" | head -n 1)
          sudo mv "$ROOTFS_FILE" ./openwrt-armvirt-64-default-rootfs.tar.gz
          
          mkdir -p inject_tmp/root
          
          echo "获取 OAF ko 内核模块..."
          OAF_RESP=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/destan19/OpenAppFilter/releases/latest")
          OAF_UI_VER=$(echo "$OAF_RESP" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          if [[ "$OAF_UI_VER" == v7* ]]; then
              OAF_KMOD_TAG="OAF_Kmods_v7.0.1"
          else
              OAF_KMOD_TAG="OAF_Kmods_v6.1.8"
          fi
          
          if [ -n "$PRIVATE_REPO" ]; then
              gh release download "$OAF_KMOD_TAG" -R "$PRIVATE_REPO" -p "oaf-${REAL_KERNEL_VER}.tar.gz" --clobber > /dev/null 2>&1 || true
          fi
          
          if [ ! -f "oaf-${REAL_KERNEL_VER}.tar.gz" ] && [ -f "../auto_import/oaf-${REAL_KERNEL_VER}.tar.gz" ]; then
              cp "../auto_import/oaf-${REAL_KERNEL_VER}.tar.gz" ./ || true
          fi
          
          if [ -f "oaf-${REAL_KERNEL_VER}.tar.gz" ]; then
              tar -xzf "oaf-${REAL_KERNEL_VER}.tar.gz" -C inject_tmp/root/ 2>/dev/null || true
              find inject_tmp/root/ -type f -name "oaf.ko" -exec mv {} inject_tmp/root/oaf.ko \; 2>/dev/null || true
              find inject_tmp/root/ -type d -empty -delete 2>/dev/null || true
          fi
          
          sudo gunzip -f ./openwrt-armvirt-64-default-rootfs.tar.gz
          
          if tar -O -xf ./openwrt-armvirt-64-default-rootfs.tar etc/os-release usr/lib/os-release etc/openwrt_release 2>/dev/null | grep -qiE '^OPENWRT_RELEASE="?LEDE' || tar -tf ./openwrt-armvirt-64-default-rootfs.tar | grep -q -E '^\.?/?root/install-to-emmc.sh$'; then
              sudo tar --delete -f ./openwrt-armvirt-64-default-rootfs.tar root/install-to-emmc.sh 2>/dev/null || true
              sudo tar --delete -f ./openwrt-armvirt-64-default-rootfs.tar ./root/install-to-emmc.sh 2>/dev/null || true
              mkdir -p inject_tmp/root
              ln -sf /usr/sbin/openwrt-install-amlogic inject_tmp/root/install-to-emmc.sh
          fi
          
          cd inject_tmp
          sudo tar -rvf ../openwrt-armvirt-64-default-rootfs.tar ./* > /dev/null 2>&1
          cd ..
          sudo gzip -9 ./openwrt-armvirt-64-default-rootfs.tar
          
          sudo chmod +x mk_s905d_n1.sh
          sudo ./mk_s905d_n1.sh
          
          sudo gzip -9 output/*.img

      - name: Extract Native Firmware & Sync Env (提取原生镜像并对接)
        if: env.FIRMWARE_LOWER == 'lede-native' || env.FIRMWARE_LOWER == 'istoreos'
        run: |
          mkdir -p packit/output packit/
          
          if [ "${{ env.FIRMWARE_LOWER }}" == "istoreos" ]; then
             TARGET_DIR="openwrt/bin/targets/amlogic/meson/"
             REAL_KERNEL_VER=$(ls openwrt/build_dir/target-*/linux-amlogic_meson/linux-* -d 2>/dev/null | head -n 1 | awk -F'linux-' '{print $NF}')
          else
             TARGET_DIR="openwrt/bin/targets/amlogic/mesongx/"
             REAL_KERNEL_VER=$(ls openwrt/build_dir/target-*/linux-amlogic_mesongx/linux-* -d 2>/dev/null | head -n 1 | awk -F'linux-' '{print $NF}')
          fi
          
          IMG_FILES=$(find "$TARGET_DIR" -type f -name "*.img.gz")
          
          if [ -n "$IMG_FILES" ]; then
            for img in $IMG_FILES; do
               cp "$img" packit/output/
               echo "✅ 成功提取镜像: $(basename "$img")"
            done
          else
            echo "❌ 找不到任何原生生成的 img.gz 镜像！"
            exit 1
          fi
          
          if [ -z "$REAL_KERNEL_VER" ]; then REAL_KERNEL_VER="native"; fi
          
          OPENWRT_VER="${{ inputs.source_branch }}"
          if [ "$OPENWRT_VER" == "master" ]; then OPENWRT_VER="R$(date +%y.%m.%d)"; fi
          
          echo "KERNEL_VERSION=$REAL_KERNEL_VER" >> packit/make.env
          echo "OPENWRT_VER=$OPENWRT_VER" >> packit/make.env
          echo "WHOAMI=粉墨悲欢@恩山" >> packit/make.env

      - name: Organize Release Files
        id: organize
        env:
          ZIP_PASS: ${{ secrets.ZIP_PASS }}
          CUSTOM_TAG: ${{ inputs.custom_tag }}
          BUILD_NOTE: ${{ inputs.build_note }}
        run: |
          mkdir release_files
          source packit/make.env
          DATETIME=$(date +'%Y%m%d%H%M')
          
          if [[ "${{ env.FIRMWARE_LOWER }}" == lede* ]]; then
             if [ -n "$CUSTOM_TAG" ]; then
                DISPLAY_VER="$CUSTOM_TAG"
             else
                DISPLAY_VER="${OPENWRT_VER}"
             fi
          else
             if [ -n "$CUSTOM_TAG" ]; then
                DISPLAY_VER="${OPENWRT_VER}-${CUSTOM_TAG}"
             else
                DISPLAY_VER="${OPENWRT_VER}"
             fi
          fi
          
          CLEAN_VER="${DISPLAY_VER}"
          if [[ "${{ env.FIRMWARE_LOWER }}" == "istoreos" ]] && [[ "$CLEAN_VER" == istoreos-* ]]; then
              CLEAN_VER="${CLEAN_VER#istoreos-}"
          fi
          
          NOTE_SUFFIX=""
          if [ -n "$BUILD_NOTE" ]; then
             SAFE_NOTE=$(echo "$BUILD_NOTE" | sed 's/[[:space:]]/_/g')
             NOTE_SUFFIX="-${SAFE_NOTE}"
          fi
          
          for img in packit/output/*.img.gz; do
             base_name="${{ env.FIRMWARE_LOWER }}-${CLEAN_VER}-${KERNEL_VERSION}_${DATETIME}${NOTE_SUFFIX}"
             new_img_name="${base_name}.img.gz"
             cp "$img" "release_files/$new_img_name"
             echo "✅ 准备发布镜像: $new_img_name"
          done
          
          if [ "${{ inputs.export_config }}" == "true" ]; then
            echo "✅ 附带输出 .config 配置文件: ${base_name}.config"
            cp openwrt/.config "release_files/${base_name}.config"
          fi
          
          cd release_files
          
          if [ "${{ env.BUILD_LOWER }}" == "personal" ]; then
            if [ -z "$ZIP_PASS" ]; then
              echo "错误：未检测到 ZIP_PASS 密钥！为保护隐私，已强制终止打包。"
              exit 1
            fi
            echo "正在为 Personal 固件进行 7z AES-256 加密打包..."
            7z a -p"$ZIP_PASS" -mhe=on "${base_name}.7z" *
            find . -type f -not -name '*.7z' -delete
          fi
          
          BRANCH_NAME="${{ github.ref_name }}"
          
          if [ -n "${{ env.TARGET_DATE_SIMPLE }}" ]; then
              BUILD_DATE="v${{ env.TARGET_DATE_SIMPLE }}"
          else
              if [ "$BRANCH_NAME" == "main" ] || [ "$BRANCH_NAME" == "master" ]; then
                BUILD_DATE="v${{ env.START_DATE }}"
              else
                if [[ "$BRANCH_NAME" != v* ]]; then
                  BUILD_DATE="v${BRANCH_NAME}"
                else
                  BUILD_DATE="${BRANCH_NAME}"
                fi
              fi
          fi
          
          if [ "${{ env.BUILD_LOWER }}" == "personal" ]; then
            TAG_NAME="personal"
          else
            TAG_NAME="${BUILD_DATE}"
          fi
          
          echo "✅ 最终设定的 Release 标签为: $TAG_NAME"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "${{ env.TAG_NAME }}"
          files: release_files/*