name: Clean Stopped Runs
on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # 【核心修复】：必须先 Checkout 代码，让环境里有 .git 目录，gh 命令才能认得路！
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: 🗑️ Delete Failed or Cancelled Runs (Keep Success)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 开始扫描流水线记录..."
          
          # 💡 核心修改：增加 conclusion 字段读取，并在 jq 筛选中排除 conclusion 为 "success" 的记录
          run_ids=$(gh run list --limit 100 --json databaseId,status,conclusion --jq '.[] | select(.status == "completed" and .conclusion != "success") | .databaseId')
          
          if [ -z "$run_ids" ]; then
            echo "🎉 没有找到需要清理的失败或取消记录，绿色成功的记录已被保留！"
            exit 0
          fi
          
          echo "开始执行删除操作："
          for id in $run_ids; do
            echo "正在删除失败/取消的记录 ID: $id"
            gh run delete $id || true
          done
          
          echo "✅ 清理完成！绿色成功的记录及正在运行的任务毫发无损。"